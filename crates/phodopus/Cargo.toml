[package]
name = "phodopus"
description = "Stackless Lua VM implemented in pure Rust (Piccolo successor with sandbox, fuel, and modular stdlib)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Source-only distribution: gc-arena is pinned to a revision that is not on
# crates.io, so the crate is intentionally non-publishable. See release.toml.
publish = false

[dependencies]
ahash.workspace = true
allocator-api2.workspace = true
anyhow.workspace = true
fhex.workspace = true
gc-arena.workspace = true
hashbrown.workspace = true
rand.workspace = true
thiserror.workspace = true
lsonar.workspace = true

[dev-dependencies]
clap = { version = "4.6", features = ["cargo"] }
rustyline = "17.0"
