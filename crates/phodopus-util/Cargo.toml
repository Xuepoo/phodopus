[package]
name = "phodopus-util"
description = "Utilities for the `phodopus` library"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Source-only distribution: gc-arena is pinned to a revision that is not on
# crates.io, so the crate is intentionally non-publishable. See release.toml.
publish = false

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true
gc-arena.workspace = true
phodopus.workspace = true

[features]
default = ["serde"]
