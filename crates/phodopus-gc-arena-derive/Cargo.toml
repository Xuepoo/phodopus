[package]
name = "phodopus-gc-arena-derive"
version = "0.5.3"
edition = "2021"
rust-version = "1.85"
authors = ["kyren <catherine@kyju.org>", "moulins", "Aaron Hill <aa1ronham@gmail.com>"]
license = "MIT"
description = "Procedural derive macros for phodopus-gc-arena (registry fork of gc-arena 0.5.3 pin)"
readme = "README.md"
repository = "https://github.com/bitty-terminal/phodopus"
documentation = "https://docs.rs/phodopus-gc-arena-derive"
homepage = "https://github.com/bitty-terminal/phodopus"
keywords = ["gc", "arena", "garbage-collection", "derive", "no-std"]
categories = ["memory-management", "no-std"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.56"
quote = "1.0.26"
syn = { version = "2.0.17", features = ["default", "visit-mut"] }
synstructure = "0.13"
