name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux quality gates. This mirrors the local `just check` warning policy: the
  # Clippy step delegates to the justfile recipe so the enforced `-D warnings`
  # baseline (CTX-0014 / PHO-006) has a single source of truth. MSRV 1.85 and
  # Windows/macOS are separate jobs below and are NOT implied by this job.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.98.1
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Install just
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --workspace --all-targets

      - name: Run Clippy (enforced warning policy)
        run: just clippy

      - name: Check unsafe ledger (CTX-0015 gate)
        run: just unsafe-ledger

      - name: Check repository-local Markdown links
        run: just links

      - name: Run tests
        run: cargo test --workspace --all-targets

  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Run tests
        run: cargo test --workspace --all-targets

  msrv:
    name: MSRV verification (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install MSRV Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check workspace under MSRV
        run: cargo +1.85.0 check --workspace --all-targets
