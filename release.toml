# Phodopus release policy.
#
# Read by `cargo-release` as the workspace configuration
# (`$WORKSPACE/release.toml`). It records the release identity, tag convention,
# and packaging model so a release is reproducible and self-consistent.

# --- Version identity -------------------------------------------------------
#
# The version line restarts at 0.0.1. Milestones are v0.1.0, v0.2.0, ...; the
# working tree between milestones carries the next milestone's pre-release
# version. `phodopus` and `phodopus-util` share one version so the Git tag,
# release title, and manifests agree. The `phodopus-gc-arena` fork crates
# intentionally track the upstream gc-arena version (0.5.3) under new names,
# so `shared-version` is false and the two version groups are checked
# separately by `just version-check` (CTX-0031).
#
# Rationale: the v0.1.0 tag was published while the manifests still declared
# the pre-release `0.1.0-alpha.1`, so tag and crate disagreed. A published tag
# is immutable; alignment moves forward to the next milestone instead of
# rewriting history.
shared-version = false
consolidate-commits = true
allow-branch = ["main"]

# --- Tag and release naming -------------------------------------------------
#
# Convention: tag `v<semver>` (for example `v0.2.0-alpha.1` or `v0.2.0`) and a
# release title of `v<version> - <summary>`. The tag and the manifest version
# must be byte-identical after the leading `v`.
tag = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"

# --- Packaging model (registry-ready via fork) --------------------------------
#
# Option F (CTX-0031, for bitty CTX-1262): `gc-arena` was pinned to the git
# revision 5a7534b883b703f23cfb8c3cfdf033460aa77ea9, which is not published on
# crates.io; the crates.io release that shares its version number (0.5.3,
# 2024-05-15) predates the pin (2024-07-23) and is API-incompatible, and the
# later 0.6/0.7 releases are breaking rewrites. The renamed fork crates
# `phodopus-gc-arena` and `phodopus-gc-arena-derive` (version 0.5.3 under new
# names, library name `gc_arena` preserved) carry the pinned source verbatim
# so `phodopus` keeps its Phase 3 quota accounting (`MetricsAlloc`,
# `DynamicRootSet`, `Collect`, pacing) with only manifest changes.
# `phodopus` and `phodopus-util` set `publish = true` (Phase A); the workspace
# dependency uses a versioned path dep (`package = "phodopus-gc-arena"`) that
# resolves to the registry once the owner publishes the fork, then the
# `phodopus` crates. Actual `cargo publish` runs remain owner-only and
# irreversible; this branch performs publish-PREP only (`--dry-run`).
publish = false
verify = false

# Release verification (run by CI on every tag) is:
#   - tag version == workspace version == phodopus/phodopus-util versions;
#     fork crates share the upstream 0.5.3 as a separate group
#   - `cargo build --locked --release --workspace` from the tagged tree
#   - `cargo package --list --workspace --allow-dirty` (file-set manifest)
#   - `cargo publish --dry-run` for the fork crates and the phodopus crates
#     (registry resolution; no publish is performed)
